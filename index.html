            item.appendChild(buyBtn);
            shopListEl.appendChild(item);
        }
    }

// ================== ПОКУПКА МОНЕТ ЗА ЗВЁЗДЫ ==================

const COIN_PACKS = [
    { id: 'small',  stars: 1,  coins: 50,  label: '50 монет' },
    { id: 'medium', stars: 10,  coins: 600,  label: '600 монет' },
    { id: 'large',  stars: 30, coins: 2000, label: '2000 монет' },
];

const API_URL = '/api';
let purchaseBusy = false;

function getTelegramUserId() {
    return window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 0;
}

// Купленные монеты не входят в сохранение уровня.
function getPaidWalletKey() {
    return 'croodle_paid_wallet_v2_' + getTelegramUserId();
}

function readPaidWallet() {
    const raw = localStorage.getItem(getPaidWalletKey());

    if (!raw) {
        return { balance: 0, creditedPurchases: [] };
    }

    const data = JSON.parse(raw);

    if (
        !Number.isSafeInteger(data.balance) ||
        data.balance < 0 ||
        !Array.isArray(data.creditedPurchases)
    ) {
        throw new Error('Повреждено сохранение купленных монет.');
    }

    return data;
}

function writePaidWallet(wallet) {
    // Не скрываем ошибку: нельзя сообщать об успешном
    // начислении, если браузер не смог его сохранить.
    localStorage.setItem(
        getPaidWalletKey(),
        JSON.stringify(wallet)
    );
}

function getAvailableCoins() {
    try {
        return coins + readPaidWallet().balance;
    } catch (error) {
        console.error('Ошибка чтения покупного баланса:', error);
        return coins;
    }
}

function creditPurchasedCoins(purchaseId, amount) {
    const wallet = readPaidWallet();

    // Повторный callback той же покупки не начисляет её дважды.
    if (wallet.creditedPurchases.includes(purchaseId)) {
        return false;
    }

    wallet.balance += amount;
    wallet.creditedPurchases.push(purchaseId);
    writePaidWallet(wallet);

    return true;
}

function renderCoinPacks() {
    const list = document.getElementById('coinPacksList');
    if (!list) return;

    list.innerHTML = '';

    for (const pack of COIN_PACKS) {
        const item = document.createElement('div');
        item.className = 'shop-item';

        const iconBox = document.createElement('div');
        iconBox.className = 'shop-item-icon';

        const img = document.createElement('img');
        img.src = `${IMG_PATH}/coin.png`;
        img.alt = 'Монеты';
        img.onerror = () => {
            iconBox.textContent = '🪙';
        };
        iconBox.appendChild(img);

        const info = document.createElement('div');
        info.className = 'shop-item-info';
        info.innerHTML =
            `<h4>${pack.label}</h4>` +
            '<p>Пополнение игрового баланса</p>';

        const buyBtn = document.createElement('button');
        buyBtn.className = 'shop-item-buy';
        buyBtn.textContent = `${pack.stars} ⭐`;
        buyBtn.disabled = purchaseBusy;
        buyBtn.addEventListener('click', () => buyCoinPack(pack.id));

        item.append(iconBox, info, buyBtn);
        list.appendChild(item);
    }
}

function finishPurchase() {
    purchaseBusy = false;

    if (shopOpen) {
        renderCoinPacks();
        renderShopList();
    }
}

async function buyCoinPack(packId) {
    if (purchaseBusy) return;

    const tg = window.Telegram?.WebApp;
    const userId = getTelegramUserId();
    const pack = COIN_PACKS.find(item => item.id === packId);

    if (!pack) return;

    if (!userId || typeof tg?.openInvoice !== 'function') {
        alert('Открой игру через Telegram, чтобы купить монеты.');
        return;
    }

    // Проверяем доступность localStorage до создания счёта.
    try {
        writePaidWallet(readPaidWallet());
    } catch (error) {
        alert(
            'Покупка отключена: не удалось сохранить баланс на устройстве. ' +
            error.message
        );
        return;
    }

    const purchaseId =
        globalThis.crypto?.randomUUID?.() ||
        `${Date.now()}_${Math.random().toString(36).slice(2)}`;

    purchaseBusy = true;
    renderCoinPacks();

    try {
        const res = await fetch(`${API_URL}/create_invoice`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                pack: pack.id,
                user_id: userId,
            }),
        });

        const text = await res.text();
        let data;

        try {
            data = JSON.parse(text);
        } catch {
            throw new Error(
                `Сервер вернул не JSON. HTTP ${res.status}. ` +
                text.slice(0, 100)
            );
        }

        if (!res.ok || !data.ok || !data.url) {
            throw new Error(
                data.error || `Не удалось создать счёт. HTTP ${res.status}`
            );
        }

        tg.openInvoice(data.url, (status) => {
            try {
                if (status === 'paid') {
                    const credited = creditPurchasedCoins(
                        purchaseId,
                        pack.coins
                    );

                    updateCoinsUI();

                    if (credited) {
                        playCoin();
                        alert(`Оплата прошла. Начислено ${pack.coins} монет.`);
                    }
                } else if (status === 'pending') {
                    alert(
                        'Платёж ещё обрабатывается. ' +
                        'Не оплачивай повторно. В этой локальной версии ' +
                        'отложенное начисление не гарантируется.'
                    );
                } else if (status === 'failed') {
                    alert('Telegram сообщил об ошибке оплаты.');
                }
            } catch (error) {
                console.error('Ошибка начисления после оплаты:', error);
                alert(
                    'Оплата получена, но сохранить монеты не удалось. ' +
                    'Не оплачивай повторно. ' + error.message
                );
            } finally {
                finishPurchase();
            }
        });
    } catch (error) {
        finishPurchase();
        alert('Не удалось открыть оплату: ' + error.message);
    }
}

    function buyBooster(id) {
    const cfg = BOOSTER_CFG[id];
    if (!cfg) return;

    try {
        const wallet = readPaidWallet();

        if (coins + wallet.balance < cfg.price) return;

        // Сначала расходуем заработанные монеты.
const earnedPart = Math.min(coins, cfg.price);
const paidPart = cfg.price - earnedPart;

        if (paidPart > 0) {
            wallet.balance -= paidPart;
            writePaidWallet(wallet);
        }

        coins -= earnedPart;
        inventory[id]++;

        updateCoinsUI();
        playCoin();
        renderShopList();
        renderInventory();
        saveProgress();
    } catch (error) {
        console.error('Ошибка покупки бустера:', error);
        alert('Не удалось купить бустер: ' + error.message);
    }
}

    // ================== СОХРАНЕНИЕ / ЗАГРУЗКА ==================
    function saveProgress() {
        try {
            const data = {
                currentTaskIndex, coins, energy, timeLeft,
                cells: cells.slice(),
                spawnerIndex,
                obstacles: obstacles.map(o => ({ ...o })),
                rows: ROWS, cols: COLS,
                inventory: { ...inventory },
                rockSlowSpawnCounter,
                taskProgress,
                gameFinished
            };
            localStorage.setItem(SAVE_KEY, JSON.stringify(data));
        } catch(e) {}
    }
    function clearSave() {
        try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
    }
    function loadProgress() {
        try {
            const raw = localStorage.getItem(SAVE_KEY);
            if (!raw) return false;
            const data = JSON.parse(raw);
            if (!data || !data.cells) return false;

            currentTaskIndex = data.currentTaskIndex || 0;
            coins = (typeof data.coins === 'number') ? data.coins : START_COINS;
            energy = (typeof data.energy === 'number') ? data.energy : START_ENERGY;
            timeLeft = (typeof data.timeLeft === 'number') ? data.timeLeft : 0;
            gameFinished = !!data.gameFinished;
            rockSlowSpawnCounter = data.rockSlowSpawnCounter || 0;
            taskProgress = data.taskProgress || 0;

            const taskDef = TASKS[currentTaskIndex] || TASKS[0];
            ROWS = taskDef.rows;
            COLS = taskDef.cols;
            TOTAL_CELLS = ROWS * COLS;

            createField(ROWS, COLS);
            cells = data.cells.slice(0, TOTAL_CELLS);
            while (cells.length < TOTAL_CELLS) cells.push(0);

            spawnerIndex = (typeof data.spawnerIndex === 'number') ? data.spawnerIndex : 0;
            if (spawnerIndex >= TOTAL_CELLS) spawnerIndex = 0;
            bindFieldHandlers(spawnerIndex);
            setFieldColsUI(COLS);

            obstacles = Array.isArray(data.obstacles) ? data.obstacles.map(o => ({ ...o })) : [];
            inventory = data.inventory ? { ...data.inventory } : { bomb:0, mega:0, cleaner:0 };

            renderField();
            refreshTaskText();
            updateTaskProgressUI();
            updateTimerUI();
            updateCoinsUI();
            updateEnergyUI();
            renderInventory();

            if (gameFinished) {
                taskTextEl.innerHTML = `🏆 <b>Все задания выполнены!</b>`;
                taskProgEl.textContent = 'Победа!';
                timerTextEl.textContent = '00:00';
                return true;
            }

            if (timerHandle) clearInterval(timerHandle);
            if (timeLeft <= 0) timeLeft = TASKS[currentTaskIndex] ? TASKS[currentTaskIndex].seconds : 60;
            updateTimerUI();
            timerHandle = setInterval(() => {
                if (shopOpen || tutorialOpen || paused || settingsOpen || mergeInFlight) return;
                timeLeft--;
                saveProgress();
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    updateTimerUI();
                    clearInterval(timerHandle); timerHandle = null;
                    runTaskFailCeremony();
                } else {
                    updateTimerUI();
                }
            }, 1000);

            if (loseCheckHandle) clearInterval(loseCheckHandle);
            loseCheckHandle = setInterval(() => {
                if (gameFinished || transitionLock || shopOpen || tutorialOpen || paused || settingsOpen) return;
                checkLose();
            }, LOSE_CHECK_INTERVAL_MS);

            takeTaskSnapshot();
            return true;
        } catch(e) { return false; }
    }

    // ================== СБРОС ==================
    function resetGame() {
        clearSave();
        closeShop();
        activeBooster = null;
        paused = false;
        settingsOpen = false;
        pauseOverlay.classList.remove('open');
        settingsOverlay.classList.remove('open');
        toastHero.classList.remove('visible', 'leaving');
        toastHeroSad.classList.remove('visible', 'leaving');
        clearInterval(timerHandle); timerHandle = null;
        if (loseCheckHandle) { clearInterval(loseCheckHandle); loseCheckHandle = null; }

        coins = START_COINS;
        energy = START_ENERGY;
        taskProgress = 0;
        spawning = false;
        gameFinished = false;
        transitionLock = false;
        currentTaskIndex = 0;
        rockSlowSpawnCounter = 0;
        shownTutorials = {};
        taskStartSnapshot = null;

        inventory = { bomb: 0, mega: 0, cleaner: 0 };

        ROWS = TASKS[0].rows;
        COLS = TASKS[0].cols;
        TOTAL_CELLS = ROWS * COLS;
        cells = new Array(TOTAL_CELLS).fill(0);
        obstacles = [];
        createField(ROWS, COLS);

        spawnerIndex = pickSpawnerIndex(ROWS, COLS);
        bindFieldHandlers(spawnerIndex);

        const allEmpty = [];
        for (let i = 0; i < TOTAL_CELLS; i++) if (i !== spawnerIndex) allEmpty.push(i);
        for (let i = allEmpty.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [allEmpty[i], allEmpty[j]] = [allEmpty[j], allEmpty[i]];
        }
        if (allEmpty[0] !== undefined) cells[allEmpty[0]] = 1;
        if (allEmpty[1] !== undefined) cells[allEmpty[1]] = 1;
        if (allEmpty[2] !== undefined) cells[allEmpty[2]] = 2;

        renderField();
        renderInventory();
        startTask(0);
    }

    // ================== СТАРТ ==================
    resetBtn.addEventListener('click', () => {
    const confirmed = confirm(
        'Сбросить уровни, заработанные монеты и все бустеры? ' +
        'Остаток купленных монет сохранится.'
    );

    if (confirmed) resetGame();
});
    shopBtn.addEventListener('click', openShop);
    shopClose.addEventListener('click', closeShop);
    shopOverlay.addEventListener('click', (e) => { if (e.target === shopOverlay) closeShop(); });
    fieldEl.addEventListener('contextmenu', e => e.preventDefault());

    // Первый жест пользователя — разрешаем звук и запускаем музыку
    ['pointerdown','click','keydown','touchstart'].forEach(ev =>
        window.addEventListener(ev, () => {
            getAudioCtx();
            startMusicIfNeeded();
        }, { once: true, passive: true })
    );

    let __resizeTimer = null;
    window.addEventListener('resize', () => {
        if (__resizeTimer) clearTimeout(__resizeTimer);
        __resizeTimer = setTimeout(() => {
            updateBoardSize(ROWS, COLS);
        }, 100);
    });

    if (!loadProgress()) resetGame();
})();
</script>
