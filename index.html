<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Croodle Merge · вертикальное поле</title>
<style>
    :root {
        --cell-size: 72px;
        --item-size: 76px;
        --cell-gap: 6px;
        --cell-radius: 16px;
        --field-cols: 5;

        --icon-size: 32px;
        --icon-size-small: 22px;

        --merge-scale: 1.35;
        --merge-brightness: 1.6;
        --merge-duration: 320ms;

        --toast-w: 520px;
        --toast-h: 720px;
        --toast-lift: 8vh;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
        margin: 0;
        height: 100vh;
        min-height: 100vh;
        font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center;
        padding: 8px;
        overflow: hidden;
    }

    .bg-layer {
        position: fixed; inset: 0; z-index: -1;
        background-image: url('images/fullscreen_bg.png');
        background-size: cover;
        background-position: center top;
        background-repeat: no-repeat;
        pointer-events: none;
    }

    .game-wrap {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: fit-content;
        max-width: 100%;
        height: 100%;
        min-height: 0;
    }

    .hud-top {
        flex: 0 0 auto;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
        width: 100%;
    }

    .task-box {
        color: #ffffff;
        font-size: 0.95rem;
        line-height: 1.3;
        text-align: center;
        min-width: 0;
        max-width: 100%;
        padding: 0 2px;
        text-shadow: 2px 2px 0 rgba(0,0,0,0.75), 0 0 8px rgba(0,0,0,0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        overflow: hidden;
    }
    .task-box b { color: #ffffff; }

    .hud-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #ffffff;
        font-weight: 700;
        font-size: 1rem;
        text-shadow: 2px 2px 0 rgba(0,0,0,0.75), 0 0 8px rgba(0,0,0,0.6);
        min-width: 68px;
        justify-content: center;
        white-space: nowrap;
    }
    .hud-chip img {
        width: var(--icon-size); height: var(--icon-size);
        object-fit: contain; display: block;
        filter: drop-shadow(0 2px 2px rgba(0,0,0,.55));
    }
    .hud-chip .icon-fallback { font-size: calc(var(--icon-size) * 0.9); line-height: 1; }
    .hud-timer.warn { color: #ffffff; }

    .hud-stack {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: center;
        gap: 4px;
        flex: 0 0 auto;
    }
    .hud-stack--left {
        align-items: flex-start;
    }
    .hud-chip--small {
        font-size: 0.88rem;
        min-width: 0;
        gap: 4px;
        justify-content: flex-end;
    }
    .hud-chip--small img {
        width: var(--icon-size-small);
        height: var(--icon-size-small);
    }
    .hud-chip--small .icon-fallback {
        font-size: calc(var(--icon-size-small) * 1.05);
    }

    /* Кнопка настроек — по размеру совпадает с чипом времени */
    .settings-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: transparent;
        border: none;
        padding: 0;
        margin: 0;
        color: #ffffff;
        font-weight: 700;
        font-size: 0.88rem;
        font-family: inherit;
        cursor: pointer;
        text-shadow: 2px 2px 0 rgba(0,0,0,0.75), 0 0 8px rgba(0,0,0,0.6);
        line-height: 1;
        transition: transform .12s;
    }
    .settings-btn:hover { transform: scale(1.08); }
    .settings-btn:active { transform: scale(0.94); }
    .settings-btn img {
        width: var(--icon-size-small);
        height: var(--icon-size-small);
        object-fit: contain;
        display: block;
        filter: drop-shadow(0 2px 2px rgba(0,0,0,.55));
    }
    .settings-btn .icon-fallback {
        width: var(--icon-size-small);
        height: var(--icon-size-small);
        display: flex; align-items: center; justify-content: center;
        font-size: calc(var(--icon-size-small) * 1.05);
    }

        .progress-bar {
        position: relative;
        width: 200px;
        max-width: 100%;
        height: 20px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 10px;
        box-shadow:
            inset 0 0 0 1.5px rgba(255, 240, 200, 0.35),
            inset 0 2px 4px rgba(0, 0, 0, 0.6);
        overflow: hidden;
        isolation: isolate;
        /* Заставляет браузер аккуратно скруглять дочерний fill на мобильных */
        -webkit-mask-image: -webkit-radial-gradient(white, black);
        mask-image: radial-gradient(white, black);
    }
        .progress-bar__fill {
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 0%;
        background-color: #ffd166;
        background-image: linear-gradient(90deg, #ffb347 0%, #ffd166 60%, #fff3c4 100%);
        background-repeat: no-repeat;
        background-size: 100% 100%;
        border-radius: inherit;
        transition: width 0.45s cubic-bezier(.34,1.4,.64,1);
        box-shadow:
            0 0 12px rgba(255, 200, 80, 0.8),
            inset 0 -2px 4px rgba(0, 0, 0, 0.25);
        /* Сглаживание на мобильных */
        transform: translateZ(0);
        will-change: width;
    }
    .progress-bar__fill.full {
        background-color: #a8ffe0;
        background-image: linear-gradient(90deg, #7ee7ff 0%, #a8ffe0 60%, #ffffff 100%);
        box-shadow:
            0 0 18px rgba(120, 230, 255, 0.9),
            inset 0 -2px 4px rgba(0, 0, 0, 0.25);
    }
    .progress-bar__text {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.78rem;
        font-weight: 800;
        color: #ffffff;
        text-shadow: 1px 1px 0 rgba(0,0,0,0.85), 0 0 6px rgba(0,0,0,0.7);
        pointer-events: none;
        z-index: 2;
        transform-origin: 50% 50%;
        will-change: transform;
    }

    .board {
        position: relative;
        flex: 0 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: var(--cell-gap);
        background: rgba(255, 240, 210, 0.08);
        -webkit-backdrop-filter: blur(12px) saturate(1.15);
        backdrop-filter: blur(12px) saturate(1.15);
        border-radius: 24px;
        box-shadow:
            0 18px 30px rgba(0, 0, 0, 0.55),
            inset 0 0 0 1.5px rgba(255, 240, 200, 0.18),
            inset 0 0 30px rgba(0, 0, 0, 0.35);
        isolation: isolate;
    }

    .field {
        display: grid;
        grid-template-columns: repeat(var(--field-cols), var(--cell-size));
        gap: var(--cell-gap);
        justify-content: center;
        align-content: center;
        touch-action: none;
        position: relative;
    }

    .cell {
        width: var(--cell-size); height: var(--cell-size);
        position: relative;
        display: flex; align-items: center; justify-content: center;
        background-image: url('images/cell_empty.png');
        background-size: 100% 100%;
        background-repeat: no-repeat;
        background-position: center;
        transition: filter .15s;
    }
    .cell.filled    { background-image: url('images/cell_filled.png'); }
    .cell.spawner {
        background-image: url('images/cell_filled.png');
        cursor: pointer;
        animation: spawnerPulse 1.6s ease-in-out infinite;
        transform-origin: 50% 50%;
        will-change: transform;
    }
    @keyframes spawnerPulse {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.06); }
    }
    .cell.obstacle  { cursor: not-allowed; }
    .cell.drop-target { filter: brightness(1.25) drop-shadow(0 0 10px #ffe27a); }
    .cell.booster-target { filter: brightness(1.4) drop-shadow(0 0 12px #ff5e7e); }

    .item {
        width: var(--item-size); height: var(--item-size);
        display: flex; align-items: center; justify-content: center;
        pointer-events: none; position: relative;
    }
    .item img {
        width: 100%; height: 100%;
        object-fit: contain;
        pointer-events: none; -webkit-user-drag: none;
    }
    .item .fallback {
        font-size: calc(var(--item-size) * 0.6);
        font-weight: bold; color: #2e241b;
        text-shadow: 2px 2px 0 rgba(0,0,0,.15);
    }
    .item.hidden { opacity: 0; }

    .obstacle {
        width: var(--item-size); height: var(--item-size);
        display: flex; align-items: center; justify-content: center;
        pointer-events: none; position: relative;
    }
    .obstacle img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .obstacle .fallback { font-size: calc(var(--item-size) * 0.7); }

    .flyer {
        position: fixed; pointer-events: none; z-index: 1000;
        width: var(--item-size); height: var(--item-size);
        display: flex; align-items: center; justify-content: center;
        background: transparent; border: none;
        filter: drop-shadow(0 12px 14px rgba(0,0,0,.45));
        will-change: left, top, transform, opacity;
    }
    .flyer img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .flyer .fallback { font-size: calc(var(--item-size) * 0.6); font-weight: bold; color: #fff; }
    .flyer.drag-ghost { transform: scale(1.12) rotate(-3deg); }

    .particle {
        position: fixed; pointer-events: none; z-index: 1600;
        border-radius: 50%;
        will-change: left, top, transform, opacity;
    }
    .bolt {
        position: fixed; pointer-events: none; z-index: 1650;
        background: linear-gradient(180deg, #ffffff, #7ee7ff 40%, #4aa8ff 100%);
        box-shadow: 0 0 14px #7ee7ff, 0 0 28px #4aa8ff;
        transform-origin: 50% 0; border-radius: 4px;
    }

    .toast-hero {
        position: fixed; left: 50%; bottom: 0;
        width: var(--toast-w); height: var(--toast-h);
        transform: translate(-50%, calc(110% - var(--toast-lift)));
        z-index: 1500; pointer-events: none;
        background-image: url('images/toast_hero.png');
        background-size: contain;
        background-position: center bottom;
        background-repeat: no-repeat;
        filter: drop-shadow(0 -8px 20px rgba(0,0,0,.4));
        transition: transform .55s cubic-bezier(.34,1.56,.64,1);
    }
    .toast-hero.visible { transform: translate(-50%, calc(0% - var(--toast-lift))); }
    .toast-hero.leaving {
        transition: transform .7s cubic-bezier(.5,0,.75,0);
        transform: translate(-50%, calc(110% - var(--toast-lift)));
    }
    .toast-hero--sad { background-image: url('images/toast_hero_sad.png'); }

    .bottom-bar {
        flex: 0 0 auto;
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        flex-wrap: nowrap;
        min-height: 56px;
        padding: 0 2px;
    }

    .inventory {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        height: 56px;
        padding: 0 10px;
        background: rgba(0,0,0,0.25);
        border-radius: 18px;
        backdrop-filter: blur(8px);
        flex: 0 0 auto;
    }
    .inv-slot {
        position: relative;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: rgba(255,255,255,0.08);
        border: 2px solid rgba(255,255,255,0.25);
        display: flex; align-items: center; justify-content: center;
        cursor: grab;
        touch-action: none;
        transition: transform .12s, border-color .15s, background .15s;
        flex: 0 0 auto;
    }
    .inv-slot:hover { background: rgba(255,255,255,0.15); }
    .inv-slot:active { cursor: grabbing; }
    .inv-slot.active {
        border-color: #ffd166;
        background: rgba(255,210,110,0.25);
        transform: scale(1.08);
        box-shadow: 0 0 14px rgba(255,209,102,.7);
    }
    .inv-slot.empty {
        opacity: 0.35;
        pointer-events: none;
    }
    .inv-slot img {
        width: 78%; height: 78%;
        object-fit: contain;
        pointer-events: none;
        filter: drop-shadow(0 2px 2px rgba(0,0,0,.5));
    }
    .inv-slot .icon-fallback { font-size: 24px; }
    .inv-count {
        position: absolute;
        right: -6px; bottom: -6px;
        min-width: 20px; height: 20px;
        padding: 0 5px;
        border-radius: 10px;
        background: #ff5e7e;
        color: #fff;
        font-size: 0.7rem;
        font-weight: bold;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 2px 4px rgba(0,0,0,.4);
        border: 2px solid #fff;
    }
    .inv-slot.empty .inv-count { display: none; }

    .reset-btn-bottom {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 56px;
        min-width: 88px;
        padding: 0 14px;
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-radius: 16px;
        font-weight: 700;
        font-size: 0.9rem;
        letter-spacing: 0.3px;
        cursor: pointer;
        white-space: nowrap;
        font-family: inherit;
        text-shadow: 1px 1px 0 rgba(0,0,0,.6);
        box-shadow:
            0 4px 0 rgba(0,0,0,.35),
            0 6px 10px rgba(0,0,0,.4);
        transition: transform .08s linear, box-shadow .08s linear, background .12s;
        flex: 0 0 auto;
    }
    .reset-btn-bottom .btn-icon { font-size: 1.1rem; line-height: 1; }
    .reset-btn-bottom .btn-label { font-size: 0.88rem; font-weight: 700; }
    .reset-btn-bottom:hover {
        background: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 255, 255, 0.55);
    }
    .reset-btn-bottom:active {
        transform: translateY(3px);
        box-shadow:
            0 1px 0 rgba(0,0,0,.35),
            0 3px 6px rgba(0,0,0,.35);
    }

    .shop-btn-bottom {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 56px;
        padding: 0 14px 0 10px;
        background: linear-gradient(180deg, #ffd166, #e0a937);
        color: #4a2e0b;
        border: 2px solid #fff3c4;
        border-radius: 18px;
        font-weight: 800;
        font-size: 0.95rem;
        letter-spacing: 0.3px;
        cursor: pointer;
        font-family: inherit;
        box-shadow:
            0 4px 0 rgba(0,0,0,.35),
            0 6px 10px rgba(0,0,0,.4);
        transition: transform .08s linear, box-shadow .08s linear;
        white-space: nowrap;
        text-shadow: 0 1px 0 rgba(255,255,255,.5);
        flex: 0 0 auto;
    }
    .shop-btn-bottom:hover { filter: brightness(1.06); }
    .shop-btn-bottom:active {
        transform: translateY(3px);
        box-shadow:
            0 1px 0 rgba(0,0,0,.35),
            0 3px 6px rgba(0,0,0,.35);
    }
    .shop-btn-bottom img {
        width: 32px; height: 32px;
        object-fit: contain;
        display: block;
        filter: drop-shadow(0 1px 1px rgba(0,0,0,.35));
    }
    .shop-btn-bottom .icon-fallback {
        font-size: 24px; line-height: 1;
        width: 32px; height: 32px;
        display: flex; align-items: center; justify-content: center;
    }
    .shop-btn-label { font-size: 0.9rem; font-weight: 800; }

    /* === Магазин === */
    .shop-overlay {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.75);
        z-index: 2000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
    }
    .shop-overlay.open { display: flex; }
    .shop-panel {
        width: min(520px, 100%);
        max-height: 90vh;
        overflow-y: auto;
        background: rgba(255, 240, 210, 0.08);
        -webkit-backdrop-filter: blur(12px) saturate(1.15);
        backdrop-filter: blur(12px) saturate(1.15);
        border-radius: 24px;
        padding: 22px 20px 18px;
        box-shadow:
            0 18px 30px rgba(0, 0, 0, 0.55),
            inset 0 0 0 1.5px rgba(255, 240, 200, 0.18),
            inset 0 0 30px rgba(0, 0, 0, 0.35);
        color: #ffffff;
        position: relative;
        isolation: isolate;
    }
    .shop-title {
        font-size: 1.3rem;
        font-weight: 800;
        text-align: center;
        margin-bottom: 6px;
        text-shadow: 2px 2px 0 rgba(0,0,0,.7);
    }
    .shop-sub {
        text-align: center;
        font-size: .85rem;
        opacity: .85;
        margin-bottom: 14px;
    }
    .shop-close {
        position: absolute;
        top: 10px; right: 14px;
        background: transparent; border: none;
        color: #fff; font-size: 1.6rem;
        cursor: pointer;
        line-height: 1;
        opacity: .8;
    }
    .shop-close:hover { opacity: 1; }

    .shop-list {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
    }
    .shop-item {
        display: grid;
        grid-template-columns: 72px 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 12px 14px;
        border-radius: 16px;
        background: rgba(255,255,255,0.06);
        border: 2px solid rgba(255,255,255,0.14);
    }
    .shop-item-icon {
        width: 72px; height: 72px;
        display: flex; align-items: center; justify-content: center;
    }
    .shop-item-icon img {
        width: 100%; height: 100%; object-fit: contain;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,.5));
    }
    .shop-item-icon .icon-fallback { font-size: 40px; }
    .shop-item-info h4 {
        margin: 0 0 4px;
        font-size: 1rem;
        font-weight: 800;
    }
    .shop-item-info p {
        margin: 0;
        font-size: .82rem;
        opacity: .85;
        line-height: 1.35;
    }
    .shop-item-buy {
        background: #ffd166;
        color: #4a2e0b;
        border: 2px solid #fff3c4;
        border-radius: 14px;
        padding: 8px 14px;
        font-weight: 800;
        font-size: .9rem;
        cursor: pointer;
        box-shadow: 0 4px 0 #8f621f;
        display: flex; align-items: center; gap: 4px;
        white-space: nowrap;
        transition: transform .08s linear;
    }
    .shop-item-buy:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #8f621f;
    }
    .shop-item-buy:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        filter: grayscale(.6);
    }
    .shop-item-buy img.shop-coin-icon {
        width: 18px; height: 18px;
        object-fit: contain;
        display: inline-block; vertical-align: middle;
        filter: drop-shadow(0 1px 1px rgba(0,0,0,.4));
    }

    /* === Туториал === */
    .tutorial-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.82);
        z-index: 2100;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        backdrop-filter: blur(4px);
    }
    .tutorial-overlay.open { display: flex; }

    .tutorial-panel {
        width: min(480px, 100%);
        max-height: 92vh;
        overflow-y: auto;
        background: rgba(255, 240, 210, 0.08);
        -webkit-backdrop-filter: blur(14px) saturate(1.2);
        backdrop-filter: blur(14px) saturate(1.2);
        border-radius: 24px;
        padding: 24px 22px 20px;
        box-shadow:
            0 18px 40px rgba(0, 0, 0, 0.65),
            inset 0 0 0 1.5px rgba(255, 240, 200, 0.25),
            inset 0 0 40px rgba(0, 0, 0, 0.35);
        color: #ffffff;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
    }
    .tutorial-image-wrap {
        width: 360px;
        height: 360px;
        max-width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 18px;
        padding: 8px;
    }
    .tutorial-image-wrap img {
        max-width: 100%; max-height: 100%;
        object-fit: contain; display: block;
        filter: drop-shadow(0 6px 10px rgba(0,0,0,.4));
    }
    .tutorial-title {
        margin: 6px 0 0;
        font-size: 1.25rem;
        font-weight: 800;
        text-shadow: 2px 2px 0 rgba(0,0,0,.6);
    }
    .tutorial-text {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.5;
        opacity: 0.95;
        max-width: 400px;
    }
    .tutorial-ok {
        margin-top: 8px;
        background: linear-gradient(180deg, #ffd166, #e0a937);
        color: #4a2e0b;
        border: 2px solid #fff3c4;
        border-radius: 16px;
        padding: 10px 26px;
        font-weight: 800;
        font-size: 1rem;
        cursor: pointer;
        box-shadow:
            0 5px 0 #8f621f,
            0 8px 14px rgba(0,0,0,.5);
        transition: transform .08s linear, box-shadow .08s linear;
        font-family: inherit;
    }
    .tutorial-ok:hover { filter: brightness(1.06); }
    .tutorial-ok:active {
        transform: translateY(4px);
        box-shadow:
            0 1px 0 #8f621f,
            0 4px 10px rgba(0,0,0,.45);
    }

    /* === Пауза === */
    .pause-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 2200;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
    }
    .pause-overlay.open { display: flex; }
    .pause-panel {
        width: min(360px, 100%);

    let audioCtx = null;
    function getAudioCtx() {
        if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }
    function tone({ freq=440, type='sine', dur=0.15, vol=0.25, slideTo=null, delay=0 }) {
        if (settings.sfxVolume <= 0) return;
        const ctx = getAudioCtx(); if (!ctx) return;
        const t0 = ctx.currentTime + delay;
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, t0);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
        const finalVol = vol * settings.sfxVolume;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(finalVol, t0 + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t0); osc.stop(t0 + dur + 0.02);
    }

    // ================== АДАПТАЦИЯ ==================
    function updateBoardSize(rows, cols) {
        boardEl.style.width = '';
        boardEl.style.height = '';
        const wrapEl = document.querySelector('.game-wrap');
        wrapEl.style.width = '';

        void boardEl.offsetHeight;

        const hudEl  = document.querySelector('.hud-top');
        const bottomEl = document.querySelector('.bottom-bar');

        const wrapRect = wrapEl.getBoundingClientRect();
        const hudH     = hudEl ? hudEl.getBoundingClientRect().height : 0;
        const bottomH  = bottomEl ? bottomEl.getBoundingClientRect().height : 0;

        const availableW = wrapRect.width;
        const availableH = Math.max(120, wrapRect.height - hudH - bottomH - 24);

        const isMobile = window.innerWidth <= 700;
        const minCell = isMobile ? 34 : 44;
        const maxCell = isMobile ? 68 : 96;
        const gap     = isMobile ? 5  : 8;

        const padding = gap;

        const bottomMinW = bottomEl
            ? (bottomEl.scrollWidth || bottomEl.offsetWidth || 0)
            : 0;

        const cellByW = (availableW - 2 * padding - (cols - 1) * gap) / cols;
        const cellByH = (availableH - 2 * padding - (rows - 1) * gap) / rows;

        let cell = Math.min(cellByW, cellByH);
        cell = Math.max(minCell, Math.min(maxCell, cell));
        cell = Math.floor(cell);

        const gridW  = cols * cell + (cols - 1) * gap;
        const gridH  = rows * cell + (rows - 1) * gap;
        const boardW = gridW + 2 * padding;
        const boardH = gridH + 2 * padding;

        document.documentElement.style.setProperty('--cell-size', cell + 'px');
        document.documentElement.style.setProperty('--item-size', Math.round(cell * 1.05) + 'px');
        document.documentElement.style.setProperty('--cell-gap',  gap + 'px');
        document.documentElement.style.setProperty('--field-cols', String(cols));

        boardEl.style.width  = boardW + 'px';
        boardEl.style.height = boardH + 'px';

        const wrapW = Math.max(boardW, bottomMinW);
        wrapEl.style.width = wrapW + 'px';
    }

    function bindFieldHandlers(spawnerIdx) {
        if (window.__fieldAC) window.__fieldAC.abort();
        window.__fieldAC = new AbortController();
        const signal = window.__fieldAC.signal;

        cellEls.forEach((cell, i) => {
            cell.classList.toggle('spawner', i === spawnerIdx);
            if (i === spawnerIdx) {
                cell.addEventListener('click', onSpawnerClick, { signal });
                cell.addEventListener('pointerdown', (e) => e.preventDefault(), { signal });
            } else {
                cell.addEventListener('pointerdown', (e) => {
                    if (activeBooster && !shopOpen && !tutorialOpen && !paused && !settingsOpen) {
                        e.preventDefault();
                        e.stopPropagation();
                        handleBoosterTap(i);
                        return;
                    }
                    onPointerDown(e);
                }, { signal });
            }
        });

    function handleBoosterTap(index) {
        if (paused || settingsOpen) return;
        if (!activeBooster) return;
        const cfg = BOOSTER_CFG[activeBooster];
        if (!cfg) return;
        if (index === spawnerIndex) return;

        let ok;
        if (!cfg.targetRequired) ok = applyBooster(activeBooster, null);
        else                     ok = applyBooster(activeBooster, index);
        if (ok) {
            activeBooster = null;
            renderInventory();
        }
    }

    function pickSpawnerIndex(rows, cols) {
        const candidates = [];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (r === 0 || r === rows-1 || c === 0 || c === cols-1) {
                    candidates.push(r * cols + c);
                }
            }
        }
        const inner = candidates.filter(i => {
            const r = Math.floor(i / cols);
            const c = i % cols;
            return !((r === 0 || r === rows-1) && (c === 0 || c === cols-1));
        });
        const pool = inner.length ? inner : candidates;
        return pool[Math.floor(Math.random() * pool.length)];
    }

    // ================== УСЛОЖНИТЕЛИ ==================
    function obstacleAt(index) { return obstacles.find(o => o.index === index) || null; }
    function hasObstacle(index) { return !!obstacleAt(index); }

    function canPlaceObstacleAt(index) {
        if (index === spawnerIndex) return false;
        if (hasObstacle(index)) return false;
        if (cells[index] > 0) return false;
        return true;
    }

    function makeObstacleEl(type) {

        img.src = `${IMG_PATH}/${cfg.img}${IMG_EXT}`;

            img.remove();
            const fb = document.createElement('div');
            fb.className = 'fallback';
            fb.textContent = cfg.fallback;
            el.appendChild(fb);
        };
        el.appendChild(img);
        return el;
    }

    function spawnObstacle(type, preferredIndex = null) {
        let index = preferredIndex;
        if (index === null || !canPlaceObstacleAt(index)) {
            const candidates = [];
            for (let i = 0; i < TOTAL_CELLS; i++) if (canPlaceObstacleAt(i)) candidates.push(i);
            if (candidates.length === 0) return false;
            index = candidates[Math.floor(Math.random() * candidates.length)];
        }
        const cfg = OBSTACLE_CFG[type];
        obstacles.push({
            type, index,
            counter: 0,
            cooldown: cfg.cooldown || 0
        });
        return true;
    }

    function tickObstacles() {
        rockSlowSpawnCounter++;
        if (rockSlowSpawnCounter >= ROCK_SLOW_SPAWN_EVERY) {
            rockSlowSpawnCounter = 0;
            if (spawnObstacle('rock_slow')) playGrow();
        }

        const snapshot = obstacles.slice();
        let grewFastThisTurn = false;
        let struckThisTurn = false;

        for (const o of snapshot) {
            if (!obstacles.includes(o)) continue;
            if (o.type === 'rock_fast') {
                if (!grewFastThisTurn) {
                    if (growRockFast(o)) { grewFastThisTurn = true; playGrow(); }
                }
            } else if (o.type === 'slayer') {
                o.cooldown--;
                if (o.cooldown <= 0 && !struckThisTurn) {
                    if (slayerStrike(o)) {
                        o.cooldown = OBSTACLE_CFG.slayer.cooldown;
                        struckThisTurn = true;
                    } else {
                        o.cooldown = 1;
                    }
                }
            }
        }

        renderField();
        saveProgress();
        checkLose();
    }

    function growRockFast(rock) {
        const row = Math.floor(rock.index / COLS);
        const col = rock.index % COLS;
        const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
        const free = [];
        for (const [dr, dc] of dirs) {
            const nr = row + dr, nc = col + dc;
            if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
            const ni = nr * COLS + nc;
            if (canPlaceObstacleAt(ni)) free.push(ni);
        }
        if (free.length === 0) return false;
        const ni = free[Math.floor(Math.random() * free.length)];

        obstacles.push({ type: 'rock_fast', index: ni, counter: 0, cooldown: 0 });
        cellEls[ni].animate(
            [{ transform: 'scale(0.3)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }],
            { duration: 260, easing: 'ease-out' }
        );
        return true;
    }

    function slayerStrike(slayer) {
        const targets = [];
        for (let i = 0; i < TOTAL_CELLS; i++) {
            if (i === spawnerIndex) continue;
            if (hasObstacle(i)) continue;
            if (cells[i] > 0) targets.push(i);
        }
        if (targets.length === 0) return false;
        const target = targets[Math.floor(Math.random() * targets.length)];

        const fromR = cellEls[slayer.index].getBoundingClientRect();
        const toR   = cellEls[target].getBoundingClientRect();
        const x1 = fromR.left + fromR.width / 2;
        const y1 = fromR.top  + fromR.height / 2;
        const x2 = toR.left + toR.width / 2;
        const y2 = toR.top  + toR.height / 2;

        playZap();
        drawLightning(x1, y1, x2, y2);

        setTimeout(() => {
            cells[target] = 0;
            renderField();
            saveProgress();
        }, 180);
        return true;
    }

    function drawLightning(x1, y1, x2, y2) {
        const segments = 6;
        const points = [{ x: x1, y: y1 }];
        for (let i = 1; i < segments; i++) {
            const t = i / segments;
            const baseX = x1 + (x2 - x1) * t;
            const baseY = y1 + (y2 - y1) * t;
            const jitter = 18;
            points.push({
                x: baseX + (Math.random() - 0.5) * jitter,
                y: baseY + (Math.random() - 0.5) * jitter
            });
        }
        points.push({ x: x2, y: y2 });

        const created = [];
        for (let i = 0; i < points.length - 1; i++) {
            const a = points[i], b = points[i + 1];
            const dx = b.x - a.x, dy = b.y - a.y;
            const len = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;
            const el = document.createElement('div');
            el.className = 'bolt';
            el.style.left = a.x + 'px';
            el.style.top  = a.y + 'px';
            el.style.width = len + 'px';
            el.style.height = '4px';
            el.style.transform = `rotate(${angle}deg)`;
            document.body.appendChild(el);
            created.push(el);
        }
        spawnParticles(x2, y2, 12, { colors: ['#ffffff','#c7f0ff','#7ee7ff'], dist: 70, gravity: 20 });
        setTimeout(() => created.forEach(el => el.remove()), 250);

        const flash = document.createElement('div');
        flash.style.position = 'fixed';
        flash.style.inset = '0';
        flash.style.background = 'rgba(180,220,255,.35)';
        flash.style.pointerEvents = 'none';
        flash.style.zIndex = '1700';
        document.body.appendChild(flash);
        flash.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, easing: 'ease-out' })
             .onfinish = () => flash.remove();
    }

    // ================== ФАБРИКА ==================
    function makeItemEl(level, kind = 'item') {
        const el = document.createElement('div');
        el.className = kind;
        const img = document.createElement('img');
        img.src = `${IMG_PATH}/item_${level}${IMG_EXT}`;
        img.alt = `item ${level}`;
        img.onerror = () => {
            img.remove();
            const fb = document.createElement('div');
            fb.className = 'fallback';
            fb.textContent = FALLBACK[level] || `?${level}`;
            el.appendChild(fb);
        };
        el.appendChild(img);
        return el;
    }
    function makeSpawnerArt() {
        const item = document.createElement('div');
        item.className = 'item';
        const img = document.createElement('img');
        img.src = `${IMG_PATH}/spawner${IMG_EXT}`;
        img.alt = 'spawner';
        img.onerror = () => {
            img.remove();
            const fb = document.createElement('div');
            fb.className = 'fallback'; fb.textContent = '✨';
            item.appendChild(fb);
        };
        item.appendChild(img);

    // ================== РЕНДЕР ==================
    function renderField() {
        for (let i = 0; i < TOTAL_CELLS; i++) {
            const cellEl = cellEls[i];
            cellEl.innerHTML = '';
            cellEl.classList.remove('filled', 'drop-target', 'obstacle', 'booster-target');

            if (i === spawnerIndex) {
                cellEl.classList.add('filled');
                cellEl.appendChild(makeSpawnerArt());
                continue;
            }

            const obs = obstacleAt(i);
            if (obs) {
                cellEl.classList.add('filled', 'obstacle');
                cellEl.appendChild(makeObstacleEl(obs.type));
                continue;
            }

            const level = cells[i];
            if (level > 0) {
                cellEl.classList.add('filled');
                cellEl.appendChild(makeItemEl(level, 'item'));
            }
        }
        updateCoinsUI();
        updateEnergyUI();
        updateTaskProgressUI();
        renderInventory();
    }

    // ================== ПАРТИКЛЫ ==================
    function spawnParticles(x, y, count = 14, opts = {}) {
        const colors = opts.colors || ['#ffe27a','#ffb347','#fff7c2','#f7d86b'];
        const baseDist = opts.dist || 70;
        const gravity = opts.gravity != null ? opts.gravity : 40;
        for (let i = 0; i < count; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = 6 + Math.random() * 8;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = (x - size/2) + 'px';
            p.style.top  = (y - size/2) + 'px';
            const c = colors[Math.floor(Math.random()*colors.length)];
            p.style.background = `radial-gradient(circle at 35% 35%, #fff, ${c} 70%)`;
            p.style.boxShadow = `0 0 10px ${c}`;
            document.body.appendChild(p);

            const angle = Math.random() * Math.PI * 2;
            const dist  = baseDist * (0.5 + Math.random() * 0.9);
            const dx = Math.cos(angle) * dist;
            const dy = Math.sin(angle) * dist - 10;
            const dur = 420 + Math.random() * 260;
            const t0 = performance.now();

            function frame(now) {
                const t = Math.min(1, (now - t0) / dur);
                const e = 1 - Math.pow(1 - t, 2);
                const px = x + dx * e;
                const py = y + dy * e + gravity * e * e;
                p.style.left = (px - size/2) + 'px';
                p.style.top  = (py - size/2) + 'px';
                p.style.opacity = String(1 - t);
                p.style.transform = `scale(${1 - 0.6 * t})`;
                if (t < 1) requestAnimationFrame(frame);
                else p.remove();
            }
            requestAnimationFrame(frame);
        }
    }

    function fireworks(cx, cy, totalBursts = 5) {
        const palette = [
            ['#ff5e7e','#ffa8b8','#fff'],
            ['#7ee7ff','#c7f0ff','#fff'],
            ['#ffe27a','#fff7c2','#fff'],
            ['#c8a2ff','#e5d4ff','#fff'],
            ['#8effa0','#d4ffdc','#fff']
        ];
        for (let b = 0; b < totalBursts; b++) {
            const ox = (Math.random() - 0.5) * 600;
            const oy = (Math.random() - 0.5) * 400 - 60;
            const delay = 120 + b * 200;
            setTimeout(() => {
                spawnParticles(cx + ox, cy + oy, 30, {
                    colors: palette[b % palette.length],
                    dist: 140, gravity: 80
                });
            }, delay);
        }
    }

    // ================== ЗАДАНИЯ ==================
    function checkTask() {
        if (gameFinished || transitionLock) return;
        const t = TASKS[currentTaskIndex];
        if (!t) return;

        if (taskProgress >= t.count) {
            taskTextEl.innerHTML = `<b>Задание выполнено!</b>`;
            runTaskCompleteCeremony();
        }
    }

    function flyItemToProgressBar(level, fromCellIndex) {
        const t = TASKS[currentTaskIndex];
        if (!t || transitionLock) return;

        const fromRect = cellEls[fromCellIndex].getBoundingClientRect();
        const fromCX = fromRect.left + fromRect.width / 2;
        const fromCY = fromRect.top  + fromRect.height / 2;

        const barEl = document.getElementById('progressBar');
        const barRect = barEl.getBoundingClientRect();
        const toCX = barRect.left + barRect.width / 2;
        const toCY = barRect.top  + barRect.height / 2;

        const ghost = makeItemEl(level, 'flyer');
        ghost.style.zIndex = '1900';
        document.body.appendChild(ghost);

        const itemSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--item-size'));
        const W = itemSize, H = itemSize;

        ghost.style.left = (fromCX - W/2) + 'px';
        ghost.style.top  = (fromCY - H/2) + 'px';
        ghost.style.transform = 'scale(1)';
        ghost.style.opacity = '1';

        const ctrlX = (fromCX + toCX) / 2;
        const ctrlY = Math.min(fromCY, toCY) - 120;

        const dur = 520;
        const t0 = performance.now();

        function frame(now) {
            const k = Math.min(1, (now - t0) / dur);
            const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;

            const mt = 1 - e;
            const cx = mt*mt*fromCX + 2*mt*e*ctrlX + e*e*toCX;
            const cy = mt*mt*fromCY + 2*mt*e*ctrlY + e*e*toCY;

            ghost.style.left = (cx - W/2) + 'px';
            ghost.style.top  = (cy - H/2) + 'px';

            const sc = 1 - e * 0.65;
            ghost.style.transform = `scale(${sc}) rotate(${e * 180}deg)`;

            if (k < 1) requestAnimationFrame(frame);
            else {
                ghost.remove();
                onProgressBarHit(barRect);
            }
        }
        requestAnimationFrame(frame);
    }

    function onProgressBarHit(barRect) {
        const t = TASKS[currentTaskIndex];
        if (!t) return;

        mergeInFlight = false;
        taskProgress++;
        if (taskProgress > t.count) taskProgress = t.count;

        const cx = barRect.left + barRect.width / 2;
        const cy = barRect.top  + barRect.height / 2;
        spawnParticles(cx, cy, 16, {
            colors: ['#ffd166','#fff3c4','#ffe27a','#ffffff'],
            dist: 70, gravity: 40
        });

        const textEl = document.getElementById('taskProgress');
        if (textEl) {
            textEl.animate(
                [
                    { transform: 'scale(1)' },
                    { transform: 'scale(1.6)', filter: 'brightness(1.5)' },
                    { transform: 'scale(1)',   filter: 'brightness(1)' }
                ],
                { duration: 500, easing: 'ease-out' }
            );
        }

        updateTaskProgressUI();
        playCoin();

        setTimeout(() => { checkTask(); }, 500);
    }

    function hasAnyMergeAvailable() {
        const counts = {};
        for (let i = 0; i < TOTAL_CELLS; i++) {
            if (i === spawnerIndex) continue;
            if (hasObstacle(i)) continue;
            const lvl = cells[i];
            if (lvl > 0 && lvl < MAX_LEVEL) {
                counts[lvl] = (counts[lvl] || 0) + 1;
                if (counts[lvl] >= 2) return true;
            }
        }
        return false;
    }

    function hasAnyFreeCell() {
        for (let i = 0; i < TOTAL_CELLS; i++) {
            if (i === spawnerIndex) continue;
            if (hasObstacle(i)) continue;
            if (cells[i] === 0) return true;
        }
        return false;
    }

    function hasAnyOccupiedCell() {
        for (let i = 0; i < TOTAL_CELLS; i++) {
            if (i === spawnerIndex) continue;
            if (hasObstacle(i)) return true;
            if (cells[i] > 0) return true;
        }
        return false;
    }

    function canProgress() {
        const t = TASKS[currentTaskIndex];
        if (!t) return true;
        if (taskProgress >= t.count) return true;

        if (inventory.cleaner > 0 && obstacles.length > 0) return true;
        if ((inventory.bomb > 0 || inventory.mega > 0) && hasAnyOccupiedCell()) return true;

        if (energy >= SPAWN_COST && hasAnyFreeCell()) return true;
        if (hasAnyMergeAvailable()) return true;

        return false;
    }

    function checkLose() {
        if (gameFinished || transitionLock) return;
        if (mergeInFlight) return;
        const t = TASKS[currentTaskIndex];
        if (!t) return;
        if (taskProgress >= t.count) return;
        if (!canProgress()) runTaskFailCeremony();
    }

    function getHeroScreenPos() {
        const styles = getComputedStyle(document.documentElement);
        const toastH = parseFloat(styles.getPropertyValue('--toast-h')) || 720;
        const liftVh = parseFloat(styles.getPropertyValue('--toast-lift')) || 8;
        const lift = window.innerHeight * (liftVh / 100);
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight - lift - toastH * 0.45;
        return { cx, cy };
    }

    function runTaskCompleteCeremony() {
        if (transitionLock) return;
        transitionLock = true;
        const t = TASKS[currentTaskIndex];

        if (t) {
            if (t.rewardEnergy) {
                energy += t.rewardEnergy;
                updateEnergyUI();
                energyTextEl.parentElement.animate(
                    [{ transform: 'scale(1)' }, { transform: 'scale(1.35)' }, { transform: 'scale(1)' }],
                    { duration: 500, easing: 'ease-out' }
                );
            }
            if (t.rewardCoins) {
                coins += t.rewardCoins;
                updateCoinsUI();
                coinsTextEl.parentElement.animate(
                    [{ transform: 'scale(1)' }, { transform: 'scale(1.35)' }, { transform: 'scale(1)' }],
                    { duration: 500, easing: 'ease-out' }
                );
            }
        }

        playFanfare();
        toastHero.classList.remove('leaving');
        toastHero.classList.add('visible');

        const { cx, cy } = getHeroScreenPos();
        const fwDelay = 700, winDur = 2400, leaveDur = 700;

        setTimeout(() => {
            const styles = getComputedStyle(document.documentElement);
            const toastH = parseFloat(styles.getPropertyValue('--toast-h')) || 720;
            fireworks(cx, cy - toastH * 0.25, 6);
        }, fwDelay);

        setTimeout(() => {
            toastHero.classList.remove('visible');
            toastHero.classList.add('leaving');
        }, winDur);

        setTimeout(() => {
            toastHero.classList.remove('leaving');
            goToNextTask();
            transitionLock = false;
        }, winDur + leaveDur);
    }

    function runTaskFailCeremony() {
        if (transitionLock) return;
        transitionLock = true;

        taskTextEl.innerHTML = `<b>Не получилось!</b>`;
        playSadTune();

        toastHeroSad.classList.remove('leaving');
        toastHeroSad.classList.add('visible');

        const loseDur = 1800, leaveDur = 700;

        setTimeout(() => {
            toastHeroSad.classList.remove('visible');
            toastHeroSad.classList.add('leaving');
        }, loseDur);

        setTimeout(() => {
            toastHeroSad.classList.remove('leaving');
            transitionLock = false;
            retryCurrentTask();
        }, loseDur + leaveDur);
    }

    function takeTaskSnapshot() {
    taskStartSnapshot = {
        energy: energy
    };
}

function restoreTaskSnapshot() {
    if (!taskStartSnapshot) return;

    // Повтор задания восстанавливает только энергию.
    // Монеты и текущий инвентарь не откатываются.
    energy = taskStartSnapshot.energy;

    updateCoinsUI();
    updateEnergyUI();
    renderInventory();
}

    function retryCurrentTask() {
        if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
        if (loseCheckHandle) { clearInterval(loseCheckHandle); loseCheckHandle = null; }

        closeShop();
        activeBooster = null;

        toastHero.classList.remove('visible', 'leaving');
        toastHeroSad.classList.remove('visible', 'leaving');

        restoreTaskSnapshot();
        startTask(currentTaskIndex);
    }

    function goToNextTask() {
        if (loseCheckHandle) { clearInterval(loseCheckHandle); loseCheckHandle = null; }

        currentTaskIndex++;
        if (currentTaskIndex >= TASKS.length) {
            gameFinished = true;
            clearInterval(timerHandle); timerHandle = null;
            timerTextEl.textContent = '00:00';
            taskTextEl.innerHTML = `🏆 <b>Все задания выполнены!</b>`;
            taskProgEl.textContent = 'Победа!';
saveProgress();
return;
        }
        startTask(currentTaskIndex);
    }

    function startTaskReal(t) {
        mergeInFlight = false;
        if (timerHandle) clearInterval(timerHandle);
        timeLeft = t.seconds;
        updateTimerUI();
        timerHandle = setInterval(() => {
            if (shopOpen || tutorialOpen || paused || settingsOpen || mergeInFlight) return;
            timeLeft--;
            if (timeLeft <= 0) {
                timeLeft = 0;
                updateTimerUI();
                clearInterval(timerHandle); timerHandle = null;
                runTaskFailCeremony();
            } else {
                updateTimerUI();
                saveProgress();
            }
        }, 1000);

        renderField();
        taskProgress = 0;
        updateTaskProgressUI();
        checkTask();
        checkLose();
        saveProgress();

        loseCheckHandle = setInterval(() => {
            if (gameFinished || transitionLock || shopOpen || tutorialOpen || paused || settingsOpen) return;
            checkLose();
        }, LOSE_CHECK_INTERVAL_MS);
    }

    function startTask(idx) {
        currentTaskIndex = idx;
        const t = TASKS[idx];
        if (!t) return;
        takeTaskSnapshot();

        if (loseCheckHandle) { clearInterval(loseCheckHandle); loseCheckHandle = null; }

        refreshTaskText();

        const newRows = t.rows, newCols = t.cols;
        const sizeChanged = (newRows !== ROWS || newCols !== COLS);

        if (sizeChanged) {
            ROWS = newRows; COLS = newCols;
            TOTAL_CELLS = ROWS * COLS;
            cells = new Array(TOTAL_CELLS).fill(0);
            createField(ROWS, COLS);
        } else {
            cells.fill(0);
            updateBoardSize(ROWS, COLS);
        }
        obstacles = [];
        rockSlowSpawnCounter = 0;

        spawnerIndex = pickSpawnerIndex(ROWS, COLS);
        bindFieldHandlers(spawnerIndex);
        setFieldColsUI(COLS);

        const allEmpty = [];
        for (let i = 0; i < TOTAL_CELLS; i++) if (i !== spawnerIndex) allEmpty.push(i);
        for (let i = allEmpty.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [allEmpty[i], allEmpty[j]] = [allEmpty[j], allEmpty[i]];
        }
        if (allEmpty[0] !== undefined) cells[allEmpty[0]] = 1;
        if (allEmpty[1] !== undefined) cells[allEmpty[1]] = 1;
        if (allEmpty[2] !== undefined) cells[allEmpty[2]] = 1;
        if (allEmpty[3] !== undefined) cells[allEmpty[3]] = 2;

        const typesForThisTask = t.obstacles || [];
        for (const type of typesForThisTask) spawnObstacle(type);

        renderField();
        taskProgress = 0;
        updateTaskProgressUI();

        if (t.tutorial && TUTORIALS[t.tutorial] && !shownTutorials[t.tutorial]) {
            if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
            shownTutorials[t.tutorial] = true;
            showTutorial(t.tutorial, () => startTaskReal(t));
        } else {
            startTaskReal(t);
        }
    }

    // ================== СПАВНЕР ==================
    function onSpawnerClick() {
        if (spawning || gameFinished || transitionLock || shopOpen || tutorialOpen || paused || settingsOpen) return;
        if (activeBooster) return;

        if (energy < SPAWN_COST) {
            energyTextEl.parentElement.animate(
                [{ transform: 'translateX(-3px)' }, { transform: 'translateX(3px)' }, { transform: 'translateX(0)' }],
                { duration: 220 }
            );
            cellEls[spawnerIndex].animate(
                [
                    { filter: 'brightness(1)' },
                    { filter: 'brightness(1.6) hue-rotate(180deg) saturate(2)' },
                    { filter: 'brightness(1)' }
                ],
                { duration: 300, easing: 'ease-out', fill: 'none' }
            );
            checkLose();
            return;
        }

        const empties = [];
        for (let i = 0; i < TOTAL_CELLS; i++) {
            if (i === spawnerIndex) continue;
            if (hasObstacle(i)) continue;
            if (cells[i] === 0) empties.push(i);
        }
        if (empties.length === 0) { checkLose(); return; }

        const spawnerAnim = cellEls[spawnerIndex].animate(
            [
                { transform: 'scale(1)' }, { transform: 'scale(1.18)' },
                { transform: 'scale(0.94)' }, { transform: 'scale(1.06)' },
                { transform: 'scale(1)' }
            ],
            { duration: 320, easing: 'ease-out', fill: 'none' }
        );
        spawnerAnim.onfinish = () => spawnerAnim.cancel();

        spawning = true;
        energy -= SPAWN_COST;
        updateEnergyUI();

        const targetIndex = empties[Math.floor(Math.random() * empties.length)];
        const spRect = cellEls[spawnerIndex].getBoundingClientRect();
        const spCX = spRect.left + spRect.width / 2;
        const spCY = spRect.top  + spRect.height / 2;
        const tgtRect = cellEls[targetIndex].getBoundingClientRect();
        const tgtCX = tgtRect.left + tgtRect.width / 2;
        const tgtCY = tgtRect.top  + tgtRect.height / 2;

        spawnParticles(spCX, spCY, 18, {
            colors: ['#ffe27a','#ffb347','#fff7c2','#f7d86b','#ffd166'],
            dist: 80
        });
        playSpawn();

        const ghost = makeItemEl(1, 'flyer');
        document.body.appendChild(ghost);
        const itemSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--item-size'));
        const W = itemSize, H = itemSize;

        ghost.style.zIndex = '5';
        ghost.style.left = (spCX - W/2) + 'px';
        ghost.style.top  = (spCY - H/2) + 'px';
        ghost.style.transform = 'scale(0.05)';
        ghost.style.opacity = '0.15';

        const ctrlX = (spCX + tgtCX) / 2;
        const ctrlY = Math.min(spCY, tgtCY) - 110;
        const dur = 410;
        const t0 = performance.now();

        function frame(now) {
            const t = Math.min(1, (now - t0) / dur);
            const e = 1 - Math.pow(1 - t, 3);
            const mt = 1 - e;
            const cx = mt*mt*spCX + 2*mt*e*ctrlX + e*e*tgtCX;
            const cy = mt*mt*spCY + 2*mt*e*ctrlY + e*e*tgtCY;

            ghost.style.left = (cx - W/2) + 'px';
            ghost.style.top  = (cy - H/2) + 'px';

            let sc;
            if (t < 0.25) sc = 0.05 + (t/0.25) * 0.95;
            else          sc = 1 + Math.sin((t - 0.25) * Math.PI) * 0.08;

            ghost.style.transform = `scale(${sc})`;
            ghost.style.opacity = String(Math.min(1, t * 4));
            if (t > 0.3) ghost.style.zIndex = '1000';

            if (t < 1) {
                requestAnimationFrame(frame);
            } else {
                ghost.remove();
                cells[targetIndex] = 1;
                renderField();
                cellEls[targetIndex].animate(
                    [{ transform: 'scale(1.15)' }, { transform: 'scale(1)' }],
                    { duration: 180, easing: 'ease-out' }
                );
                spawning = false;
                tickObstacles();
                checkLose();
                saveProgress();
            }
        }
        requestAnimationFrame(frame);
    }

    // ================== DRAG ==================
    function onPointerDown(e) {
        if (shopOpen || tutorialOpen || paused || settingsOpen) return;
        if (activeBooster) return;
        const cellEl = e.currentTarget;
        const index = Number(cellEl.dataset.index);
        if (index === spawnerIndex) return;
        if (hasObstacle(index)) return;
        if (cells[index] === 0) return;
        if (dragState) return;
        if (gameFinished || transitionLock) return;

        e.preventDefault();
        cellEl.setPointerCapture(e.pointerId);

        const level = cells[index];
        const itemInCell = cellEl.querySelector('.item');
        if (itemInCell) itemInCell.classList.add('hidden');

        const rect = cellEl.getBoundingClientRect();
        const itemSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--item-size'));
        const offsetX = (rect.width - itemSize) / 2;
        const offsetY = (rect.height - itemSize) / 2;

        const ghost = makeItemEl(level, 'flyer drag-ghost');
        ghost.style.left = (rect.left + offsetX) + 'px';
        ghost.style.top  = (rect.top  + offsetY) + 'px';
        document.body.appendChild(ghost);

        dragState = {
            fromIndex: index,
            ghost, pointerId: e.pointerId,
            startX: e.clientX, startY: e.clientY,
            startLeft: rect.left + offsetX, startTop: rect.top + offsetY,
            moved: false, currentTarget: null
        };

        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', onPointerUp);
    }

    function onPointerMove(e) {
        if (!dragState || e.pointerId !== dragState.pointerId) return;
        dragState.moved = true;

        const dx = e.clientX - dragState.startX;
        const dy = e.clientY - dragState.startY;
        dragState.ghost.style.left = (dragState.startLeft + dx) + 'px';
        dragState.ghost.style.top  = (dragState.startTop  + dy) + 'px';

        const target = findCellUnderPointer(e.clientX, e.clientY);
        if (dragState.currentTarget && dragState.currentTarget !== target) {
            dragState.currentTarget.classList.remove('drop-target');
        }
        if (target && target !== cellEls[dragState.fromIndex]
            && Number(target.dataset.index) !== spawnerIndex
            && !hasObstacle(Number(target.dataset.index))) {
            target.classList.add('drop-target');
            dragState.currentTarget = target;
        } else {
            dragState.currentTarget = null;
        }
    }

    function onPointerUp(e) {
        if (!dragState || e.pointerId !== dragState.pointerId) return;
        const { fromIndex, ghost, moved, currentTarget } = dragState;
        ghost.remove();

        const fromCellEl = cellEls[fromIndex];
        const origItem = fromCellEl.querySelector('.item');
        if (origItem) origItem.classList.remove('hidden');
        if (currentTarget) currentTarget.classList.remove('drop-target');

        const target = findCellUnderPointer(e.clientX, e.clientY);
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
        window.removeEventListener('pointercancel', onPointerUp);

        const fromIdx = fromIndex;
        dragState = null;

        if (!moved || !target) { renderField(); return; }

        const targetIndex = Number(target.dataset.index);
        if (targetIndex === fromIdx) { renderField(); return; }
        if (targetIndex === spawnerIndex) { renderField(); return; }
        if (hasObstacle(targetIndex)) { renderField(); return; }

        const fromLevel = cells[fromIdx];
        const toLevel   = cells[targetIndex];
        let didAction = false;

        if (toLevel === 0) {
            cells[targetIndex] = fromLevel;
            cells[fromIdx] = 0;
            renderField();
            cellEls[targetIndex].animate(
                [{ transform: 'scale(1.15)' }, { transform: 'scale(1)' }],
                { duration: 180, easing: 'ease-out' }
            );
            didAction = true;
        } else if (toLevel === fromLevel && fromLevel < MAX_LEVEL) {
            const newLevel = fromLevel + 1;
            const t = TASKS[currentTaskIndex];

            if (t && newLevel >= t.level && taskProgress < t.count) {
                mergeInFlight = true;
                cells[fromIdx] = 0;
                cells[targetIndex] = 0;
                renderField();
                playMerge();

                const r = cellEls[targetIndex].getBoundingClientRect();
                spawnParticles(r.left + r.width/2, r.top + r.height/2, 16, {
                    colors: ['#ffd9f0','#c7f0ff','#fff2b0','#ffb347'], dist: 60
                });

                cellEls[targetIndex].animate(
                    [
                        { transform: 'scale(1)',    filter: 'brightness(1)' },
                        { transform: 'scale(1.35)', filter: 'brightness(1.6)' },
                        { transform: 'scale(1)',    filter: 'brightness(1)' }
                    ],
                    { duration: 320, easing: 'ease-out' }
                );

                flyItemToProgressBar(newLevel, targetIndex);
                didAction = true;
            } else {
                cells[targetIndex] = newLevel;
                cells[fromIdx] = 0;
                renderField();
                playMerge();

                const r = cellEls[targetIndex].getBoundingClientRect();
                spawnParticles(r.left + r.width/2, r.top + r.height/2, 16, {
                    colors: ['#ffd9f0','#c7f0ff','#fff2b0','#ffb347'], dist: 60
                });

                const styles = getComputedStyle(document.documentElement);
                const mergeScale      = parseFloat(styles.getPropertyValue('--merge-scale'))      || 1.35;
                const mergeBrightness = parseFloat(styles.getPropertyValue('--merge-brightness')) || 1.6;
                const mergeDuration   = parseFloat(styles.getPropertyValue('--merge-duration'))   || 320;

                cellEls[targetIndex].animate(
                    [
                        { transform: 'scale(1)',    filter: 'brightness(1)' },
                        { transform: `scale(${mergeScale})`, filter: `brightness(${mergeBrightness})` },
                        { transform: 'scale(1)',    filter: 'brightness(1)' }
                    ],
                    { duration: mergeDuration, easing: 'ease-out' }
                );
                didAction = true;
            }
        } else {
            renderField();
        }

        if (didAction) {
            tickObstacles();
            checkLose();
            saveProgress();
        }
    }

    function findCellUnderPointer(clientX, clientY) {
        for (let i = 0; i < cellEls.length; i++) {
            const r = cellEls[i].getBoundingClientRect();
            if (clientX >= r.left && clientX <= r.right &&
                clientY >= r.top  && clientY <= r.bottom) return cellEls[i];
        }
        return null;
    }

    // ================== БУСТЕРЫ ==================
    function applyBooster(boosterId, targetIndex) {
        if (paused || settingsOpen) return false;
        if (!BOOSTER_CFG[boosterId]) return false;
        if (inventory[boosterId] <= 0) return false;

        const toClear = new Set();
        const rows = ROWS, cols = COLS;

        if (boosterId === 'bomb' && targetIndex != null) {
            const r = Math.floor(targetIndex / cols);
            const c = targetIndex % cols;
            const offsets = [[0,0],[0,-1],[0,1],[-1,0],[1,0]];
            for (const [dr, dc] of offsets) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                    const ni = nr * cols + nc;
                    if (ni !== spawnerIndex) toClear.add(ni);
                }
            }
        } else if (boosterId === 'mega' && targetIndex != null) {
            const r = Math.floor(targetIndex / cols);
            const c = targetIndex % cols;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                        const ni = nr * cols + nc;
                        if (ni !== spawnerIndex) toClear.add(ni);
                    }
                }
            }
        } else if (boosterId === 'cleaner') {
            for (const o of obstacles) {
                if (o.index !== spawnerIndex) toClear.add(o.index);
            }
            for (const idx of toClear) {
                obstacles = obstacles.filter(o => o.index !== idx);
            }
            playBoom();
            for (const idx of toClear) {
                const r = cellEls[idx].getBoundingClientRect();
                spawnParticles(r.left + r.width/2, r.top + r.height/2, 14, {
                    colors: ['#c8a2ff','#e5d4ff','#fff'], dist: 60, gravity: 40
                });
            }
            inventory[boosterId]--;
            renderField();
            checkLose();
            saveProgress();
            return true;
        }

        if (toClear.size === 0) return false;

        for (const idx of toClear) {
            cells[idx] = 0;
            obstacles = obstacles.filter(o => o.index !== idx);
        }

        playBoom();
        const targetRect = cellEls[targetIndex].getBoundingClientRect();
        spawnParticles(targetRect.left + targetRect.width/2, targetRect.top + targetRect.height/2, 26, {
            colors: boosterId === 'mega'
                ? ['#ff5e7e','#ffa8b8','#fff','#ffb347']
                : ['#ffe27a','#ffb347','#fff'],
            dist: boosterId === 'mega' ? 130 : 90,
            gravity: 90
        });
        cellEls[targetIndex].animate(
            [{ transform: 'scale(1.3)' }, { transform: 'scale(1)' }],
            { duration: 240, easing: 'ease-out' }
        );

        inventory[boosterId]--;
        renderField();
        checkLose();
        saveProgress();
        return true;
    }

    function renderInventory() {
        inventoryEl.innerHTML = '';
        for (const id of ['bomb','mega','cleaner']) {
            const cfg = BOOSTER_CFG[id];
            const slot = document.createElement('div');
            slot.className = 'inv-slot' + (inventory[id] === 0 ? ' empty' : '')
                                      + (activeBooster === id ? ' active' : '');
            slot.dataset.booster = id;
            slot.title = `${cfg.name} — ${cfg.desc}`;

            const img = document.createElement('img');
            img.src = `${IMG_PATH}/${cfg.img}${IMG_EXT}`;
            img.alt = cfg.name;
            img.onerror = () => {
                img.remove();
                const fb = document.createElement('span');
                fb.className = 'icon-fallback';
                fb.textContent = cfg.fallback;
                slot.insertBefore(fb, slot.firstChild);
            };
            slot.appendChild(img);

            const count = document.createElement('span');
            count.className = 'inv-count';
            count.textContent = inventory[id];
            slot.appendChild(count);

            slot.addEventListener('pointerdown', (e) => onInventoryPointerDown(e, id));
            slot.addEventListener('click', (e) => {
                if (slot.dataset.dragged === '1') {
                    slot.dataset.dragged = '0';
                    return;
                }
                onInventoryClick(id);
            });

            inventoryEl.appendChild(slot);
        }
    }

    function onInventoryClick(id) {
        if (shopOpen || tutorialOpen || paused || settingsOpen) return;
        if (inventory[id] <= 0) return;
        if (gameFinished || transitionLock) return;

        const cfg = BOOSTER_CFG[id];
        if (cfg.targetRequired) {
            activeBooster = (activeBooster === id) ? null : id;
            renderInventory();
        } else {
            applyBooster(id, null);
            renderInventory();
        }
    }

    let boosterDragState = null;

    function onInventoryPointerDown(e, id) {
        if (shopOpen || tutorialOpen || paused || settingsOpen) return;
        if (gameFinished || transitionLock) return;
        if (inventory[id] <= 0) return;

        e.preventDefault();
        const slot = e.currentTarget;
        slot.dataset.dragged = '0';

        const cfg = BOOSTER_CFG[id];
        const rect = slot.getBoundingClientRect();

        boosterDragState = {
            id,
            pointerId: e.pointerId,
            startX: e.clientX,
            startY: e.clientY,
            offsetX: e.clientX - rect.left,
            offsetY: e.clientY - rect.top,
            ghost: null,
            moved: false,
            slot
        };

        const ghost = document.createElement('div');
        ghost.className = 'flyer drag-ghost';
        ghost.style.zIndex = '1800';
        ghost.style.opacity = '0';
        ghost.style.pointerEvents = 'none';

        const img = document.createElement('img');
        img.src = `${IMG_PATH}/${cfg.img}${IMG_EXT}`;
        img.alt = cfg.name;
        img.onerror = () => {
            img.remove();
            const fb = document.createElement('div');
            fb.className = 'fallback';
            fb.textContent = cfg.fallback;
            ghost.appendChild(fb);
        };
        ghost.appendChild(img);

        document.body.appendChild(ghost);
        boosterDragState.ghost = ghost;

        window.addEventListener('pointermove', onInventoryPointerMove);
        window.addEventListener('pointerup', onInventoryPointerUp);
        window.addEventListener('pointercancel', onInventoryPointerUp);
    }

    function onInventoryPointerMove(e) {
        if (!boosterDragState || e.pointerId !== boosterDragState.pointerId) return;

        const dx = e.clientX - boosterDragState.startX;
        const dy = e.clientY - boosterDragState.startY;

        if (!boosterDragState.moved) {
            if (Math.hypot(dx, dy) < 6) return;
            boosterDragState.moved = true;
            boosterDragState.slot.dataset.dragged = '1';
            boosterDragState.ghost.style.opacity = '1';
        }

        boosterDragState.ghost.style.left = (e.clientX - boosterDragState.offsetX) + 'px';
        boosterDragState.ghost.style.top  = (e.clientY - boosterDragState.offsetY) + 'px';

        const target = findCellUnderPointer(e.clientX, e.clientY);
        if (boosterDragState.currentTarget && boosterDragState.currentTarget !== target) {
            boosterDragState.currentTarget.classList.remove('drop-target');
        }
        if (target && Number(target.dataset.index) !== spawnerIndex) {
            target.classList.add('drop-target');
            boosterDragState.currentTarget = target;
        } else {
            boosterDragState.currentTarget = null;
        }
    }

    function onInventoryPointerUp(e) {
        if (!boosterDragState || e.pointerId !== boosterDragState.pointerId) return;

        const { id, ghost, moved, currentTarget, slot } = boosterDragState;

        if (ghost) ghost.remove();
        if (currentTarget) currentTarget.classList.remove('drop-target');

        window.removeEventListener('pointermove', onInventoryPointerMove);
        window.removeEventListener('pointerup', onInventoryPointerUp);
        window.removeEventListener('pointercancel', onInventoryPointerUp);

        if (!moved) { boosterDragState = null; return; }

        const target = findCellUnderPointer(e.clientX, e.clientY);
        if (target) {
            const index = Number(target.dataset.index);
            if (index !== spawnerIndex) {
                const cfg = BOOSTER_CFG[id];
                let ok = false;
                if (!cfg.targetRequired) ok = applyBooster(id, null);
                else                     ok = applyBooster(id, index);
                if (ok) activeBooster = null;
            }
        }

        setTimeout(() => { slot.dataset.dragged = '0'; }, 0);
        boosterDragState = null;
        renderInventory();
    }

    
    // ================== МАГАЗИН ==================
function openShop() {
    if (
        gameFinished ||
        transitionLock ||
        tutorialOpen ||
        paused ||
        settingsOpen
    ) {
        return;
    }

    shopOpen = true;
    activeBooster = null;

    renderInventory();
    shopOverlay.classList.add('open');
    renderShopList();
    renderCoinPacks();
}

function closeShop() {
    shopOpen = false;
    shopOverlay.classList.remove('open');
}

    function renderShopList() {
        shopListEl.innerHTML = '';
        for (const id of ['bomb','mega','cleaner']) {
            const cfg = BOOSTER_CFG[id];
            const item = document.createElement('div');
            item.className = 'shop-item';

            const iconBox = document.createElement('div');

            img.alt = cfg.name;
            img.onerror = () => {
                img.remove();
                const fb = document.createElement('span');
                fb.className = 'icon-fallback';
                fb.textContent = cfg.fallback;
                iconBox.appendChild(fb);
            };
            iconBox.appendChild(img);

            const info = document.createElement('div');

            buyBtn.className = 'shop-item-buy';

            const priceSpan = document.createElement('span');
            priceSpan.textContent = cfg.price;
            buyBtn.appendChild(priceSpan);

            const coinImg = document.createElement('img');
            coinImg.src = `${IMG_PATH}/coin${IMG_EXT}`;
            coinImg.alt = 'coin';
            coinImg.className = 'shop-coin-icon';
            coinImg.onerror = () => {
                coinImg.remove();
                const fb = document.createElement('span');
                fb.textContent = '🪙';
                fb.style.fontSize = '16px';
                buyBtn.appendChild(fb);
            };
            buyBtn.appendChild(coinImg);

            buyBtn.disabled = getAvailableCoins() < cfg.price;
            buyBtn.addEventListener('click', () => buyBooster(id));

            item.appendChild(iconBox);
